services:
  loganalyzer:
    build: .
    image: loganalyzer:local
    env_file: [.env]
    ports:
      # Loopback ONLY (spec §4.3 / owner ruling 6-a): there is no auth, and a 0.0.0.0 bind
      # would bypass the host firewall via Docker's NAT. Guardhouse is reached through the
      # host's VPN (default bridge egress) — the analyst's VPN is out of scope for this tool.
      - "127.0.0.1:8090:8080"
    volumes:
      - loganalyzer_data:/data
    read_only: true
    # Our own ceiling for an H2-sized page (the client abandons a page past 64 MiB).
    mem_limit: 512m
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).status == 200 else 1)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  loganalyzer_data:
